name: Build for Android

on:
  # Enable manual run
  workflow_dispatch:
  push:
    tags:
      - "**"
    branches:
      - "**"
    paths:
      - .github/workflows/android.yml
      # Aha! copy: build (and publish an update) whenever the app changes.
      - lib/**
      - android/**
      - assets/**
      - packages/**
      - pubspec.yaml
      - pubspec.lock

jobs:
  build-android:
    name: Build APK (${{ matrix.foss && 'FOSS' || 'Regular' }})
    strategy:
      fail-fast: false
      matrix:
        # Aha! copy: only the regular build. The FOSS build strips Google
        # libraries, including the handwriting recognition this copy adds.
        foss: ${{ github.repository == 'saber-notes/saber' && fromJSON('[false, true]') || fromJSON('[false]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: "./.github/shared_workflows/install_apt_dependencies"

      - name: Setup Flutter
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter
          no-save-caches: true

      - name: Restore cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .dart_tool/
            .flutter-plugins-dependencies
            build/
            linux/flutter/ephemeral/
            macos/Flutter/ephemeral/
            packages/**/.dart_tool/
            packages/**/.flutter-plugins-dependencies
            packages/**/pubspec.lock
            windows/flutter/ephemeral/
            ~/.dartServer/
            ~/.dart-tool/
          key: ${{ runner.OS }}-saber-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.OS }}-saber-

      - name: Setup keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        if: ${{ env.SIGNING_KEY != '' }}
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > android/android.keystore
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ALIAS }}" >> android/key.properties
          echo "storeFile=../android.keystore" >> android/key.properties

      - name: Setup Android build tools
        run: |
          ANDROID_NDK=/usr/local/lib/android/sdk/ndk/29.0.14206865
          echo "ANDROID_NDK=$ANDROID_NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK" >> $GITHUB_ENV

          echo "JAVA_HOME=$JAVA_HOME_25_X64" >> $GITHUB_ENV

      - name: Disable Flutter CLI animations
        run: flutter config --no-cli-animations

      - run: ./patches/pre/remove_proprietary_dependencies.sh
        if: matrix.foss
      - run: patch pubspec.lock < patches/pre/pubspec-fdroid.lock.patch
        if: matrix.foss

      - name: Build apk
        # Aha! copy: no prompts to install the upstream Saber, which would
        # be a separate app without this copy's additions.
        run: |
          if [ "${{ github.repository }}" = "saber-notes/saber" ]; then
            flutter build apk
          else
            # Each build gets its own version (e.g. 1.37.1-aha.3) matching
            # its release, so Obtainium can tell when there's an update.
            buildName=$(grep -oP "(?<=buildName = ').*(?=')" lib/data/version.dart)
            flutter build apk --dart-define=UPDATE_CHECK="false" \
              --build-name="${buildName}-aha.${{ github.run_number }}"
          fi

      - name: Rename apk
        id: rename_apk
        run: |
          buildName=$(grep -oP "(?<=buildName = ').*(?=')" lib/data/version.dart)
          if [ "${{ matrix.foss }}" = "true" ]; then
            apkName="Saber_FOSS_v${buildName}.apk"
          else
            apkName="Saber_v${buildName}.apk"
          fi
          echo "apkName=$apkName" >> $GITHUB_OUTPUT
          echo "buildName=$buildName" >> $GITHUB_OUTPUT

          mkdir -p output
          mv build/app/outputs/flutter-apk/app-release.apk output/$apkName

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.foss && 'Saber-Android-FOSS' || 'Saber-Android' }}
          path: output/${{ steps.rename_apk.outputs.apkName }}

      - name: Upload to GitHub release
        uses: svenstaro/upload-release-action@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: output/${{ steps.rename_apk.outputs.apkName }}

      - name: Remove the old aha-latest release (Aha! copy)
        # Replaced by numbered releases below. Safe to run when it's gone.
        if: ${{ github.repository != 'saber-notes/saber' && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete aha-latest --cleanup-tag --yes -R "${{ github.repository }}" || true

      - name: Publish a numbered release (Aha! copy)
        # Each build is its own release, e.g. v1.37.1-aha.3, marked latest.
        # Obtainium on the tablet watches these and offers the update;
        # https://github.com/<owner>/saber/releases/latest always opens the newest.
        uses: svenstaro/upload-release-action@v2
        if: ${{ github.repository != 'saber-notes/saber' && github.event_name != 'pull_request' }}
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: output/${{ steps.rename_apk.outputs.apkName }}
          asset_name: Saber-Aha.apk
          tag: v${{ steps.rename_apk.outputs.buildName }}-aha.${{ github.run_number }}
          target_commit: ${{ github.sha }}
          release_name: Saber Aha ${{ steps.rename_apk.outputs.buildName }} (build ${{ github.run_number }})
          body: Tap Saber-Aha.apk below to download it on the tablet, then open it to install. Obtainium picks this up automatically.
          overwrite: false
          make_latest: true

      - name: Build aab
        if: ${{ matrix.foss == false && github.repository == 'saber-notes/saber' }}
        run: |
          flutter build appbundle \
            --dart-define=FLAVOR="Google Play" \
            --dart-define=APP_STORE="Google Play" \
            --dart-define=UPDATE_CHECK="false"

          mkdir -p output
          mv build/app/outputs/bundle/release/app-release.aab output/Saber.aab

      - name: Upload artifact
        if: ${{ matrix.foss == false && github.repository == 'saber-notes/saber' }}
        uses: actions/upload-artifact@v7
        with:
          name: Saber-Android-PlayStore
          path: output/Saber.aab

  upload-to-play-store:
    name: Upload to Play Store
    runs-on: ubuntu-latest
    needs: build-android
    if: ${{ startsWith(github.ref, 'refs/tags/') && github.repository == 'saber-notes/saber' }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: Saber-Android-PlayStore
          path: output

      - name: Prepare whatsnew directory from metadata/*/changelogs
        working-directory: ${{ github.workspace }}
        run: |
          # display changelogs for debugging
          find metadata -name '*.txt'

          mkdir -p whatsnew

          # get current version code from lib/data/version.dart
          VERSION_CODE=$(grep -oP '(?<=buildNumber = )\d+' lib/data/version.dart)

          # copy changelogs of each language to whatsnew
          for dir in metadata/*/changelogs; do
              # get language code from directory name
              # e.g. metadata/en-US/changelogs -> en-US
              lang=${dir#metadata/}
              lang=${lang%/changelogs}

              # get original changelog file
              original="$dir/$VERSION_CODE.txt"

              if [ -f "$original" ]; then
                # copy changelog file to whatsnew
                cp "$original" "whatsnew/whatsnew-${lang}"
              fi
          done

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON }}
          packageName: com.adilhanney.saber
          releaseFiles: output/Saber.aab
          track: production
          status: completed
          whatsNewDirectory: whatsnew
